site_name: XAI-Framework
site_description: "Model-agnostic explainable AI with unified consensus explanations"
site_url: https://adaumsilva.github.io/XAI-framework/
repo_url: https://github.com/adaumsilva/XAI-framework
repo_name: adaumsilva/XAI-framework

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Methods:
      - Overview: methods/index.md
      - Coalition (Shapley): methods/coalition.md
      - Surrogate: methods/surrogate.md
      - Permutation: methods/permutation.md
      - Consensus & Agreement: methods/consensus.md
  - Extending: extending.md
  - API Reference:
      - Overview: api/index.md
      - Auto: api/auto.md
      - Explainers: api/explainers.md
      - Explanation: api/explanation.md
      - Model Adapter: api/model.md
      - Registry: api/registry.md
  - Changelog: changelog.md
