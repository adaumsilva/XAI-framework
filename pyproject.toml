[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-framework"
version = "0.1.0"
description = "Model-agnostic explainable AI: native Shapley-coalition, local-surrogate and permutation explainers combined into one consensus explanation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XAI-Framework contributors" }]
keywords = ["explainable-ai", "xai", "interpretability", "shapley", "feature-attribution", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "pymdown-extensions>=10.7",
]
dev = [
  "xai-framework[plot]",
  "xai-framework[docs]",
  "pytest>=7",
  "pytest-cov",
  "ruff>=0.4",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/adaumsilva/XAI-framework"
Documentation = "https://adaumsilva.github.io/XAI-framework/"
Issues = "https://github.com/adaumsilva/XAI-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xai_framework"]

[tool.coverage.run]
source = ["xai_framework"]
